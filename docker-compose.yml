version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_consistent_hash_exchange
      && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: .
      dockerfile: fastapi_service/Dockerfile
    container_name: fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./fastapi_service/app:/app
    ports:
      - "8000:8000"
    env_file:
      - ./fastapi_service/app/.env
    depends_on:
      - rabbitmq
    networks:
      - backend
    develop:
      watch:
        - action: sync
          path: ./fastapi_service/app
          target: /app
          ignore:
            - __pycache__/
           
  celery:
    build:
      context: .
      dockerfile: celery_service/Dockerfile
    container_name: celery
    develop:
      watch:
        - action: sync
          path: ./celery_service
          target: /app/celery_service
          ignore:
            - __pycache__/
        - action: rebuild
          path: celery_service/Dockerfile
    command: celery -A config.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./celery_service:/app/celery_service
    env_file:
      - ./celery_service/.env
    depends_on:
      - rabbitmq
    networks:
      - backend
  celery_beat:
    build:
      context: .
      dockerfile: celery_service/Dockerfile
    container_name: celery_beat
    command: celery -A config.celery_app beat --loglevel=info
    volumes:
      - ./celery_service:/app/celery_service
    env_file:
      - ./celery_service/.env
    depends_on:
      - rabbitmq
    networks:
      - backend

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - local-pgdata:/var/lib/postgresql/data
      # - ~/apps/postgres:/var/lib/postgresql/data
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - backend

  flower:
    image: mher/flower
    container_name: flower
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - FLOWER_PORT=5555
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
    networks:
      - backend

networks:
  backend:
    driver: bridge
volumes:
  flower_data:
  local-pgdata:
  pgadmin-data: